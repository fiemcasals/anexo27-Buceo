server {
    listen 80;
    server_name _;
    client_max_body_size 50M;

    # Sirve el frontend compilado de React
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Esto es vital para React Router (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Redirige /api al backend de Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Los estudios subidos, servidos por nginx y no por Django: Django solo los
    # sirve con DEBUG=True (core/urls.py), asi que apagar el debug los dejaria
    # todos en 404.
    location /media/ {
        alias /usr/share/nginx/media/;
        expires 1h;
    }
}
